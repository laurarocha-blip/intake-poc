<meta charset="utf-8">
<title>Intake de POC V360</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@300;400;600;700;900&display=swap">
<style>
:root{
  --surface:#FFFFFF;--surface2:#F5F6F7;--field:#FFFFFF;--border:#DDE1EC;--bstrong:#B7B7B7;
  --text:#000000;--muted:#5B5470;--brand:#490064;--accent:#7A22D9;--selbg:#F7F1FD;
  --offbg:#F5F6F7;--offfg:#8A8596;
  --warnbg:#FFF6E6;--warnbd:#F1CF8E;--warnfg:#7A4B00;
  --infobg:#F7F1FD;--infobd:#E4D5F7;
  --err:#C4321A;--errbg:#FFF1ED;
  --primary:#490064;--onprimary:#FFFFFF;--cta:#FF4C2D;--ctah:#E63E20;
  --track:#ECE6F3;--hl:linear-gradient(0deg,#ECE2FA,#F7F1FD);
  --shadow:0 1px 2px rgba(20,5,38,.04),0 9px 22px rgba(20,5,38,.07);
  --pagebg:linear-gradient(0deg,#E9DCF5 0%,#FFFFFF 55%);
  --head:rgba(255,255,255,.82);
  --ff:'Titillium Web',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#140F19;--surface2:#1B1521;--field:#0E0A12;--border:#2E2737;--bstrong:#4C4358;
    --text:#FFFFFF;--muted:#C4BACF;--brand:#F5CCF5;--accent:#B582FF;--selbg:rgba(150,51,255,.16);
    --offbg:#110D15;--offfg:#756D80;
    --warnbg:rgba(255,184,77,.09);--warnbd:rgba(255,184,77,.32);--warnfg:#FFCF85;
    --infobg:rgba(229,215,243,.06);--infobd:#3A2F47;
    --err:#FF8F75;--errbg:rgba(255,76,45,.10);
    --primary:#F5CCF5;--onprimary:#2A0039;
    --track:#2A2233;--hl:linear-gradient(0deg,rgba(150,51,255,.22),rgba(150,51,255,.10));
    --shadow:0 1px 2px rgba(0,0,0,.3),0 9px 22px rgba(0,0,0,.35);
    --pagebg:linear-gradient(180deg,#07050A,#140A1E);--head:rgba(20,15,25,.82);
  }
}
:root[data-theme="dark"]{
  --surface:#140F19;--surface2:#1B1521;--field:#0E0A12;--border:#2E2737;--bstrong:#4C4358;
  --text:#FFFFFF;--muted:#C4BACF;--brand:#F5CCF5;--accent:#B582FF;--selbg:rgba(150,51,255,.16);
  --offbg:#110D15;--offfg:#756D80;
  --warnbg:rgba(255,184,77,.09);--warnbd:rgba(255,184,77,.32);--warnfg:#FFCF85;
  --infobg:rgba(229,215,243,.06);--infobd:#3A2F47;
  --err:#FF8F75;--errbg:rgba(255,76,45,.10);
  --primary:#F5CCF5;--onprimary:#2A0039;
  --track:#2A2233;--hl:linear-gradient(0deg,rgba(150,51,255,.22),rgba(150,51,255,.10));
  --shadow:0 1px 2px rgba(0,0,0,.3),0 9px 22px rgba(0,0,0,.35);
  --pagebg:linear-gradient(180deg,#07050A,#140A1E);--head:rgba(20,15,25,.82);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;font-family:var(--ff);color:var(--text);background:var(--pagebg);background-attachment:fixed;font-size:16px;line-height:1.5;min-height:100vh;}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;}
h1,h2,h3,p{margin:0;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.fade{animation:fadeUp .25s ease both;}
@media (prefers-reduced-motion:reduce){.fade{animation:none;}html{scroll-behavior:auto;}}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:var(--head);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.hdr-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
.hdr img{height:28px;display:block;}
.hdr .ttl{font-weight:600;color:var(--muted);padding-left:16px;border-left:1px solid var(--border);}
.hdr .sp{flex:1;}
.hdr .saved{font-size:13px;color:var(--muted);display:none;}
@media (min-width:1060px){.hdr .saved{display:block;}}
.btn{border-radius:999px;border:1.5px solid var(--bstrong);background:transparent;padding:9px 20px;font-weight:600;transition:background .15s,border-color .15s;}
.btn:hover{border-color:var(--accent);}
.btn.sm{padding:6px 14px;font-size:14px;}
.btn.primary{background:var(--primary);color:var(--onprimary);border-color:var(--primary);}
.btn.cta{background:var(--cta);border-color:var(--cta);color:#fff;font-size:18px;font-weight:700;padding:12px 28px;}
.btn.cta:hover{background:var(--ctah);border-color:var(--ctah);}
.btn.off{background:var(--offbg);color:var(--offfg);border-color:var(--border);cursor:not-allowed;}
.seg{display:inline-flex;border:1.5px solid var(--border);border-radius:999px;overflow:hidden;}
.seg button{border:0;background:transparent;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted);}
.seg button.on{background:var(--primary);color:var(--onprimary);}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:40px 24px 120px;display:grid;grid-template-columns:1fr;gap:48px;}
@media (min-width:900px){.wrap{grid-template-columns:240px 1fr;}}
.side{display:none;}
@media (min-width:900px){.side{display:block;position:sticky;top:96px;align-self:start;}}
.side h4{margin:0 0 8px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:700;}
.pbar{height:6px;border-radius:99px;background:var(--track);overflow:hidden;}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s;}
.side small{display:block;margin:8px 0 18px;color:var(--muted);font-size:14px;}
.sitem{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:transparent;border:0;padding:8px 0;}
.sitem .c{flex:0 0 32px;height:32px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);}
.sitem .t b{display:block;font-size:15px;font-weight:600;}
.sitem .t span{font-size:13px;color:var(--muted);}
.sitem.cur .c{border-color:var(--accent);background:var(--accent);color:#fff;}
.sitem.done .c{border-color:var(--accent);background:var(--selbg);color:var(--accent);}
.sitem.pend .c{border-color:var(--err);color:var(--err);}
.sitem.pend .t span{color:var(--err);font-weight:600;}
.side .tip{margin-top:20px;font-size:13px;color:var(--muted);}
.mbar{position:sticky;top:57px;z-index:20;background:var(--head);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:8px 20px;}
.mbar .l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:6px;}
.mbar .segs{display:flex;gap:4px;}
.mbar .segs button{flex:1;height:6px;border:0;border-radius:99px;background:var(--track);padding:0;}
.mbar .segs button.on{background:var(--accent);}
@media (min-width:900px){.mbar{display:none;}}

/* step head */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);}
.sh h1{font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.02em;margin:6px 0 10px;}
.sh h1 span{font-weight:300;}
.sh p{font-size:18px;color:var(--muted);max-width:60ch;}
@media (max-width:600px){.sh h1{font-size:32px;}}
.main{min-width:0;display:grid;gap:14px;align-content:start;}

/* rows (respostas dadas) */
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);}
.row .ic{flex:0 0 28px;height:28px;border-radius:50%;background:var(--selbg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;}
.row .tx{flex:1;min-width:0;}
.row .tx small{display:block;font-size:13px;color:var(--muted);}
.row .tx b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row .lk{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 6px;}
.row.err{border-color:var(--err);background:var(--errbg);}
.row.err .ic{background:var(--errbg);color:var(--err);}
.row.err .lk{color:var(--err);}

/* pergunta atual */
.q{border:1.5px solid var(--accent);border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:28px;display:grid;gap:16px;}
.q .qe{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);}
.q h2{font-size:24px;line-height:1.2;font-weight:700;}
.q .help{color:var(--muted);font-size:16px;}
.q .prem{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:15px;text-align:left;}
.qfoot{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:6px;}
.qfoot .hint{font-size:14px;color:var(--muted);}
.next{border:2px dashed var(--border);border-radius:16px;padding:16px 20px;color:var(--muted);font-size:15px;}
.next b{color:var(--text);}
.done-bar{border:2px solid #9633FF;border-radius:16px;background:var(--hl);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.done-bar b{font-size:20px;}

/* campos */
.fld{width:100%;border:1.5px solid var(--bstrong);border-radius:12px;background:var(--field);color:var(--text);padding:12px 14px;font-family:inherit;font-size:16px;}
.fld:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--selbg);}
textarea.fld{min-height:96px;resize:vertical;}
.lbl{display:block;font-size:14px;font-weight:600;margin:0 0 6px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid3{display:grid;grid-template-columns:1.2fr 1.4fr 1fr;gap:12px;}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr;}}
.opts{display:grid;gap:10px;}
.opts.cols{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);}
.opt:hover{border-color:var(--accent);}
.opt .mk{flex:0 0 18px;height:18px;border:1.5px solid var(--bstrong);margin-top:3px;border-radius:5px;position:relative;}
.opt.rd .mk{border-radius:50%;}
.opt .ot b{display:block;font-weight:600;font-size:16px;}
.opt .ot small{display:block;color:var(--muted);font-size:14px;margin-top:2px;}
.opt.on{border-color:var(--accent);background:var(--selbg);}
.opt.on .mk{border-color:var(--accent);background:var(--accent);}
.opt.on .mk::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
.opt.rd.on .mk::after{left:4px;top:4px;width:6px;height:6px;border:0;border-radius:50%;background:#fff;transform:none;}
.opt.off{background:var(--offbg);color:var(--offfg);cursor:help;}
.opt.off .ot small{color:var(--offfg);}
.opt.off:hover{border-color:var(--border);}
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 16px;font-weight:600;font-size:15px;}
.pill.on{border-color:var(--accent);background:var(--selbg);color:var(--accent);}
.pill.off{background:var(--offbg);color:var(--offfg);cursor:help;}
.hr{border:0;border-top:1px solid var(--border);margin:6px 0;}

/* avisos */
.nt{border:1.5px solid var(--infobd);background:var(--infobg);border-radius:12px;padding:12px 16px;font-size:15px;}
.nt.warn{border-color:var(--warnbd);background:var(--warnbg);color:var(--warnfg);}
.nt.err{border-color:var(--err);background:var(--errbg);color:var(--err);}
.nt b{font-weight:700;}
.nt ul{margin:6px 0 0;padding-left:20px;display:grid;gap:4px;}
.ptag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1.5px solid var(--infobd);border-radius:999px;padding:2px 10px;color:var(--brand);}

/* grupos de fluxo */
.mg{border:1.5px solid var(--border);border-radius:14px;overflow:hidden;}
.mgh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:0;padding:14px 16px;}
.mgh .tt{flex:1;}
.mgh b{display:block;font-size:17px;}
.mgh small{color:var(--muted);font-size:14px;}
.mgh .cnt{font-size:13px;color:var(--muted);font-weight:600;}
.mgh .chev{transition:transform .2s;}
.mg.open .chev{transform:rotate(90deg);}
.mgb{padding:12px 16px 16px;background:var(--surface2);display:none;}
.mg.open .mgb{display:block;}
.lvl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:16px 0 8px;}
.tools{display:flex;gap:8px;flex-wrap:wrap;}

/* revisão */
.rv{border:1.5px solid var(--border);border-radius:16px;background:var(--surface);padding:20px 24px;box-shadow:var(--shadow);}
.rv .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.rv .rh h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);font-weight:700;}
.rv .rh button{background:none;border:0;color:var(--accent);font-weight:600;}
.rv .rr{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:6px 0;font-size:15px;}
.rv .rr span{color:var(--muted);}
@media (max-width:700px){.rv .rr{grid-template-columns:1fr;gap:2px;}}
.tbl{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0;overflow-x:auto;display:block;}
.tbl th{background:#000;color:#fff;text-transform:uppercase;letter-spacing:.08em;font-size:12px;text-align:left;padding:8px 12px;}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border);}
.termo{border:2px solid #9633FF;border-radius:16px;background:var(--hl);padding:18px 22px;}
.warnlist{display:grid;gap:6px;}

/* upload */
.cardx{border:1.5px solid var(--border);border-radius:16px;background:var(--surface);padding:22px;display:grid;gap:12px;box-shadow:var(--shadow);}
.cardx h3{font-size:18px;}
.sw{display:flex;gap:12px;align-items:center;}
.sw input[type=color]{width:56px;height:56px;border:1.5px solid var(--bstrong);border-radius:12px;background:var(--field);padding:2px;cursor:pointer;}
.drop{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed var(--bstrong);border-radius:14px;padding:22px;color:var(--muted);font-weight:600;cursor:pointer;background:var(--surface2);}
.drop:hover{border-color:var(--accent);color:var(--accent);}
.prev{display:flex;gap:14px;align-items:center;}
.prev img{max-height:96px;max-width:160px;object-fit:contain;border:1px solid var(--border);border-radius:10px;background:#fff;padding:4px;}

/* modal */
.mback{position:fixed;inset:0;z-index:100;background:rgba(10,4,18,.58);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeUp .15s ease both;}
.modal{background:var(--surface);color:var(--text);border-radius:20px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.4);display:grid;gap:14px;border:1.5px solid var(--border);}
.modal .eyebrow{display:block;}
.modal h2{font-size:24px;line-height:1.2;}
.modal p{color:var(--text);}
.modal ul{margin:0;padding-left:20px;display:grid;gap:8px;}
.modal .mfoot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}

/* capa e final */
.hero{min-height:100vh;color:#fff;background:linear-gradient(160deg,#07050A 0%,#2A0E45 52%,#5B1B8F 100%);}
.hero-in{max-width:1080px;margin:0 auto;padding:36px 24px 100px;}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;}
.hero .top img{height:40px;}
.hero .top span{color:#F5CCF5;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.hero h1{font-size:clamp(40px,7vw,72px);line-height:1.04;font-weight:700;letter-spacing:-.02em;margin:56px 0 18px;}
.hero h1 span{font-weight:300;}
.hero .lead{font-size:20px;max-width:62ch;color:#fff;}
.hero .sub{font-size:16px;color:#C9BFD6;margin-top:10px;}
.glass{background:rgba(229,215,243,.09);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px 24px;}
.hero .frow{display:flex;gap:16px;margin:28px 0;flex-wrap:wrap;align-items:stretch;}
.hero .fact small{display:block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#F5CCF5;font-weight:700;}
.hero .fact b{font-size:20px;}
.hero .warnbox{flex:1;min-width:260px;border:1.5px solid rgba(255,184,77,.4);background:rgba(255,184,77,.1);border-radius:20px;padding:16px 20px;color:#FFCF85;font-size:15px;}
.hero h2{font-size:28px;margin:44px 0 6px;}
.hero .secsub{color:#C9BFD6;margin-bottom:16px;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;}
.pcard h3{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.pcard h3 i{flex:0 0 28px;height:28px;border-radius:50%;border:1.5px solid #F5CCF5;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;color:#F5CCF5;}
.pcard ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:15px;color:#E9E1F1;}
.pcard li{padding-left:18px;position:relative;}
.pcard li::before{content:"";position:absolute;left:0;top:9px;width:7px;height:7px;border-radius:50%;background:#FF4C2D;}
.steps5{display:grid;gap:12px;margin:0;padding:0;list-style:none;}
.steps5 li{display:flex;gap:14px;align-items:flex-start;}
.steps5 i{flex:0 0 32px;height:32px;border-radius:50%;border:1.5px solid #F5CCF5;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;color:#F5CCF5;}
.hero .ack{margin-top:34px;display:grid;gap:18px;}
.hero .opt{background:rgba(229,215,243,.09);border-color:rgba(255,255,255,.2);color:#fff;}
.hero .opt .mk{border-color:#C9BFD6;}
.hero .opt.on{background:rgba(150,51,255,.25);border-color:#B582FF;}
.hero .opt.on .mk{background:#B582FF;border-color:#B582FF;}
.hero .btn{border-color:#fff;color:#fff;}
.hero .btn.cta{border-color:var(--cta);}
.hero .btn.off{background:rgba(255,255,255,.1);color:#9C93AA;border-color:rgba(255,255,255,.2);}
.final{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#07050A 0%,#2A0E45 52%,#5B1B8F 100%);color:#fff;}
.final .glass{max-width:640px;width:100%;border-radius:32px;padding:40px;text-align:center;display:grid;gap:16px;justify-items:center;}
.final img{height:36px;}
.final .ok{width:64px;height:64px;border-radius:50%;background:var(--cta);display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;}
.final h1{font-size:36px;}
.final p{color:#E9E1F1;}
.final .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.final .btn{border-color:#fff;color:#fff;}
.final .btn.cta{border-color:var(--cta);}
.final .lk{background:none;border:0;color:#F5CCF5;text-decoration:underline;}

/* v3: seções do fluxo, chips, contador */
.opts.cols2{grid-template-columns:1fr 1fr;}
@media (max-width:520px){.opts.cols2{grid-template-columns:1fr;}}
.q.bare{padding:24px;}
.fstep{display:flex;gap:8px;flex-wrap:wrap;}
.fchip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--surface);border-radius:999px;padding:5px 14px 5px 6px;font-weight:600;font-size:14px;max-width:100%;}
.fchip i{flex:0 0 24px;height:24px;border-radius:50%;background:var(--track);color:var(--muted);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;}
.fchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
.fchip.cur{border-color:var(--accent);background:var(--selbg);color:var(--accent);}
.fchip.cur i{background:var(--accent);color:#fff;}
.fchip.ok i{background:var(--selbg);color:var(--accent);}
.fhead2{display:grid;gap:4px;}
.fhead2 h2{font-size:30px;line-height:1.15;}
.fhead2 small{color:var(--muted);font-size:15px;}
.fhead2 .ptag{justify-self:start;}
.sec{border-top:1px solid var(--border);padding-top:18px;display:grid;gap:12px;}

function clone(o) { return JSON.parse(JSON.stringify(o)); }
function tog(arr, v) { return arr.indexOf(v) > -1 ? arr.filter(function (x) { return x !== v; }) : arr.concat([v]); }
function countList(t) { return (t || "").split(/[\n,;]+/).filter(function (x) { return x.trim(); }).length; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function lc(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
function fluxoById(id) { return FLUXOS.filter(function (f) { return f.id === id; })[0] || null; }
function selFlows(d) { return d.fluxosSel.map(fluxoById).filter(Boolean); }

function newCfg(f) { return { entrada: [], val: VALIDACOES[f.macro].map(function (v) { return v.id; }), auto: AUTOS.filter(function (a) { return a.padrao; }).map(function (a) { return a.v; }), valOutras: "" }; }
function cfgOf(d, f) { d.cfg = d.cfg || {}; if (!d.cfg[f.id]) d.cfg[f.id] = newCfg(f); return d.cfg[f.id]; }
function cfgPeek(d, f) { return (d.cfg && d.cfg[f.id]) || newCfg(f); }
function entradaOpcoes(f) {

}

function pendings(d) {
  var P = [];
  [0, 1, 2].forEach(function (st) { questions(st, d).forEach(function (q, i) { if (!q.valid(d)) P.push({ step: st, i: i, title: q.title, prem: q.prem || "obrig" }); }); });
  if (!hexOk(d.corPrimaria)) P.push({ step: 3, i: 0, title: "Cor primária no formato #RRGGBB", prem: "idv" });
  if (!hexOk(d.corSecundaria)) P.push({ step: 3, i: 0, title: "Cor secundária no formato #RRGGBB", prem: "idv" });
  if (!d.termo) P.push({ step: 4, i: 0, title: "Aceite do termo de compromisso", prem: "termo" });
  return P;
}
function stepDone(st, d) {
  if (st <= 2) { var qs = questions(st, d); return qs.length > 0 && qs.every(function (q) { return q.valid(d); }) && S.reached[st] >= qs.length; }
  if (st === 3) return !!S.visited[3] && hexOk(d.corPrimaria) && hexOk(d.corSecundaria);
  return false;
}
function stepStatus(i) {
  var P = S.showErr ? pendings(S.d).filter(function (p) { return p.step === i; }) : [];
  if (i === S.step) return ["cur", "Você está aqui"];
  if (P.length) return ["pend", "Com pendência"];
  if (stepDone(i, S.d)) return ["done", "Concluído"];
  if (i === 3) return ["", "Opcional"];
  return ["", S.visited[i] ? "Em andamento" : "A fazer"];
}

function introHtml() {
  var li = function (a) { return a.map(function (x) { return "<li>" + x + "</li>"; }).join(""); };
  var cards = [
    ["Captura", ["Captura automática (NFS-e, NF-e, CT-e) exige o <b>certificado A1</b> do CNPJ.", "<b>NFS-e:</b> ambiente nacional e prefeituras. Se a POC tem outros itens, até <b>5 prefeituras</b> avaliadas no detalhe.", "<b>NF-e e CT-e:</b> SEFAZ, que aceita só uma ferramenta por CNPJ. Se já existe outra, use a SEFAZ de homologação ou upload e e-mail.", "<b>Concessionárias e outros:</b> só e-mail ou upload."]],
    ["Limite de fluxos", ["No máximo <b>3 fluxos</b>. Documentos não têm limite.", "Cada fluxo é definido por inteiro, um de cada vez: como entra, o que valida e o que automatiza.", "<b>Módulos adicionais</b> (opcionais): no máximo <b>2</b> por POC."]],
    ["Validações e automações", ["As validações já existem por padrão e <b>vêm todas marcadas</b>: desmarque o que não quiser testar. Das automações, só a atribuição automática vem marcada.", "O que estiver fora da lista é <b>customização</b>: a V360 avalia e pode mudar escopo e prazo."]],
    ["Integração", ["A integração com o ERP é <b>avaliada pela V360</b>, que envia orçamento (abatido se o projeto fechar).", "A V360 <b>não altera o ERP</b>.", "Sem integração, as validações contra pedido e de tributos usam <b>uma base simulada</b>: uma planilha que você preenche <b>no modelo da V360</b>. Fora do padrão, ela não é lida."]]
  ];
  var steps = ["<b>Cliente e participantes</b>", "<b>Integração</b>", "<b>Fluxos</b>: até 3, um de cada vez", "<b>Identidade visual</b> (opcional)", "<b>Revisão e envio</b>"];
  return '<div class="hero"><div class="hero-in fade">' +
    '<div class="top"><img src="' + LOGO_D + '" alt="V360"><span>Prova de conceito · Ingresso Fiscal</span></div>' +
    '<h1>Vamos planejar <span>a sua POC</span></h1>' +
    '<p class="lead">Responda este formulário para a V360 montar o roteiro de testes, a apresentação de kickoff e preparar o seu ambiente. As respostas ficam salvas enquanto você preenche.</p>' +
    '<div class="frow"><div class="glass fact"><small>Tempo de resposta</small><b>Cerca de 20 minutos</b></div>' +
    '<div class="warnbox"><b>Responda com atenção.</b> O planejamento todo parte destas respostas. Mudar depois pode alterar o cronograma. Na dúvida, confirme com a sua equipe.</div></div>' +
    '<h2>As regras da POC</h2><p class="secsub">Elas já vêm aplicadas nos campos. Quando algo estiver bloqueado ou for obrigatório, um aviso explica o motivo.</p>' +
    '<div class="pgrid">' + cards.map(function (c, i) { return '<div class="glass pcard"><h3><i>' + (i + 1) + '</i>' + c[0] + '</h3><ul>' + li(c[1]) + '</ul></div>'; }).join("") + '</div>' +
    '<h2>Como funciona</h2><ol class="steps5">' + steps.map(function (s, i) { return '<li><i>' + (i + 1) + '</i><span>' + s + '</span></li>'; }).join("") + '</ol>' +
    (S.retomar ? '<div class="warnbox" style="margin:18px 0"><b>Encontramos respostas salvas neste navegador.</b> Empresa: <b>' + esc(S.retomar.empresa || "(sem nome)") + '</b>' + (S.retomar.cnpj ? ' · CNPJ ' + esc(S.retomar.cnpj) : '') + (S.retomar.ponto ? ' · ponto focal ' + esc(S.retomar.ponto) : '') + '. São as suas? Se não forem, comece do zero para não enviar dados de outra pessoa.<div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px"><button type="button" class="btn cta" data-act="retomar">Continuar com estas respostas</button><button type="button" class="btn" data-act="zerar">Começar do zero</button></div></div>' : '') +
    (S.retomar ? '' : '<div class="ack">' + opt({ type: "check", act: "introok", label: "Li e estou ciente das regras da POC", on: S.introOk }) +
    '<div style="display:flex;gap:14px;flex-wrap:wrap;align-items:center"><button type="button" class="btn cta' + (S.introOk ? "" : " off") + '" data-act="' + (S.introOk ? "start" : "startoff") + '">Começar →</button></div></div>') +
    '</div></div>';
}

function trailHtml() {
  var curto = ["Cliente", "Integração", temApuracao(S.d) ? "Documentos" : "Fluxos", "Identidade", "Revisão"];
  return '<nav class="trail" aria-label="Passos">' + STEPS.map(function (s, i) {
    var st = stepStatus(i);
    return '<button type="button" class="tr ' + st[0] + '" data-act="go" data-v="' + i + '"' + (st[0] === "cur" ? ' aria-current="step"' : '') + '><i>' + (st[0] === "done" ? CK : i + 1) + '</i><span>' + curto[i] + '</span></button>';
  }).join('<s></s>') + '</nav>';
}
function headerHtml() {
  return '<header class="hdr"><div class="hdr-in"><img class="logo-l" src="' + LOGO_L + '" alt="V360"><img class="logo-d" src="' + LOGO_D + '" alt="V360">' + trailHtml() + '</div></header>';
}
function footHtml() {
  return '<footer class="foot"><span>Respostas salvas neste navegador</span><button type="button" class="btn" data-act="reset">' + (S.resetArmed ? "Apagar as respostas?" : "Recomeçar") + '</button>' +
    '<div class="seg" role="group" aria-label="Tema">' + [["auto", "Auto"], ["light", "Claro"], ["dark", "Escuro"]].map(function (t) { return '<button type="button" class="' + (S.theme === t[0] ? "on" : "") + '" data-act="theme" data-v="' + t[0] + '">' + t[1] + '</button>'; }).join("") + '</div></footer>';
}
function stepHead(i) {
  var t = STEPS[i], parts = t.split(" ");
  return '<div class="sh fade"><div class="eyebrow">Passo ' + (i + 1) + ' de 5</div><h1>' + parts[0] + (parts.length > 1 ? " <span>" + parts.slice(1).join(" ") + "</span>" : "") + '</h1><p>' + STEP_SUB[i] + '</p></div>';
}
function rowHtml(q, i, d, err) {
  return '<div class="row' + (err ? " err" : "") + '"><span class="ic">' + (err ? "!" : CK) + '</span><div class="tx"><small>' + esc(q.label) + '</small><b>' + esc(q.summary(d) || "—") + '</b></div>' +
    '<button type="button" class="lk" data-act="alt" data-v="' + i + '">' + (err ? "Corrigir" : "Alterar") + '</button></div>';

    case "apurtoggle": d.apurDocs = tog(d.apurDocs || [], v); break;
    case "enttoggle": { var c1 = cfgOf(d, flowOfEl(el)); c1.entrada = tog(c1.entrada, v); break; }
    case "valtoggle": { var c2 = cfgOf(d, flowOfEl(el)); c2.val = tog(c2.val, v); break; }
    case "valall": { var f3 = flowOfEl(el); cfgOf(d, f3).val = VALIDACOES[f3.macro].map(function (x) { return x.id; }); break; }
    case "valnone": cfgOf(d, flowOfEl(el)).val = []; break;
    case "autotoggle": { var c4 = cfgOf(d, flowOfEl(el)); c4.auto = tog(c4.auto, v); break; }
    case "mtoggle": S.openM[v] = !isOpen(v, el.getAttribute("data-def") === "1"); break;
    case "fsec": { var pv = v.split(":"); S.fs[pv[0]] = parseInt(pv[1], 10); S._scroll = 1; break; }
    case "vclose": S.fs[v] = 3; S._scroll = 1; break;
    case "modtoggle": {
      var mm = moduloById(v), tinha = (d.mods || []).indexOf(v) > -1, mot = modMotivoBloqueio(d, mm);
      S.modAviso = "";
      if (!tinha && mot) { S.modal = premModal("modulos", mot); break; }
      d.mods = tog(d.mods || [], v);
      if (tinha) S.modAviso = limparFluxosAuto(d).join(" ");
      if (!tinha && mm.macros && !fluxoDoModulo(d, mm) && mm.fx && fluxoById(mm.fx) && d.fluxosSel.length < maxFluxos(d)) {
        d.fluxosSel.push(mm.fx); cfgOf(d, fluxoById(mm.fx)); d.fxAuto = (d.fxAuto || []).concat([mm.fx]);
        S.modAviso = "Marcamos o fluxo " + fluxoById(mm.fx).nome + ", porque " + mm.nome + " vale para fluxos de " + modTipos(mm) + ". Você pode trocar na escolha de fluxos.";
      }
      break;
    }
    case "voff": S.modal = { eyebrow: "Falta responder", title: "Confirme a base simulada", paras: ["<b>Falta:</b> a ciência da base simulada."].concat(PREM.bases.x) }; break;
    case "eoff": { var fe = fluxoById(v); S.modal = { eyebrow: "Falta responder", title: "Complete a entrada deste fluxo", paras: ["<b>Falta:</b> " + entradaMissing(d, fe).join("; ") + "."] }; break; }
    case "eclose": S.fs[v] = 2; S._scroll = 1; break;
    case "addpref": {
      if (d.prefs.length >= maxPref(d)) { S.modal = premModal("nfse", "O limite é de " + maxPref(d) + " prefeituras" + (soCaptura(d) ? "." : " quando a POC tem outros itens além da captura.")); break; }
      d.prefs.push({ uf: "", mun: "" }); break;
    }
    case "rmpref": d.prefs.splice(parseInt(v, 10), 1); if (!d.prefs.length) d.prefs.push({ uf: "", mun: "" }); break;
    case "dlbase": {
      (async function () {
        try {
          var bin = atob(BASE_XLSX), u8 = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
          var dl = await claude.use("downloads");
          if (dl) { await dl.save({ filename: "base-de-validacao-modelo-v360.xlsx", data: u8 }); return; }
        } catch (x) {}
      })();
      return;
    }
    case "addcnpj": d.cnpjs.push({ cnpj: "", nome: "" }); break;
    case "rmcnpj": d.cnpjs.splice(parseInt(v, 10), 1); if (!d.cnpjs.length) d.cnpjs.push({ cnpj: "", nome: "" }); break;
    case "addfolga": d.folgas.push({ de: "", ate: "" }); break;
    case "rmfolga": d.folgas.splice(parseInt(v, 10), 1); if (!d.folgas.length) d.folgas.push({ de: "", ate: "" }); break;
    case "addpart": d.participantes.push({ nome: "", email: "", grupo: "" }); break;
    case "rmpart": d.participantes.splice(parseInt(v, 10), 1); if (!d.participantes.length) d.participantes.push({ nome: "", email: "", grupo: "" }); break;
    case "next": nextQ(); return;
    case "nextoff": { var q = curQuestion(); S.modal = { eyebrow: "Falta responder", title: q.bare ? "Este fluxo ainda está incompleto" : "Responda para continuar", paras: [q.missing ? "<b>Falta:</b> " + q.missing(S.d).join("; ") + "." : "<b>" + q.title + "</b>"].concat(q.why ? [q.why] : []).concat((PREM[q.prem || "obrig"] || PREM.obrig).x) }; break; }
    case "alt": S.cur[S.step] = parseInt(v, 10); render(); focusCard(); return;
    case "blocked": S.modal = premModal(el.getAttribute("data-prem"), el.getAttribute("data-msg")); break;
    case "prem": S.modal = premModal(v); break;
    case "termo": S.modal = { eyebrow: "Termo de compromisso", title: "Termo de compromisso da POC", blocks: termoDoc(d) }; break;
    case "go": goTo(parseInt(v, 10)); return;
    case "stepnext": goTo(Math.min(4, S.step + 1)); return;

    case "introok": S.introOk = !S.introOk; break;
    case "retomar": { var rt = S.retomar; S.retomar = null; S.introOk = true; S.screen = rt.screen; S.step = rt.step; render(); window.scrollTo(0, 0); return; }
    case "zerar": { try { localStorage.removeItem(STORE); } catch (x) {} S = fresh(); render(); window.scrollTo(0, 0); return; }
    case "start": S.screen = "form"; S.step = 0; render(); window.scrollTo(0, 0); return;
    case "startoff": S.modal = { eyebrow: "Antes de começar", title: "Confirme que leu as regras", paras: ["Marque \"Li e estou ciente das regras da POC\" para começar. As regras valem para todas as respostas do formulário."] }; break;
    case "theme": S.theme = v; break;

      if (!S.resetArmed) { S.resetArmed = true; render(); setTimeout(function () { if (S.resetArmed) { S.resetArmed = false; render(); } }, 3000); return; }
      try { localStorage.removeItem(STORE); } catch (x) {}
      S = fresh(); render(); window.scrollTo(0, 0); return;
    }
    case "colorclear": d[v] = ""; break;
    case "rmfile": d[v] = null; S.idvErro = ""; break;
    case "submit": submit(); return;
    case "mgo": { var p0 = S._first; S.modal = null; if (p0) { S.step = p0.step; if (p0.step <= 2) S.cur[p0.step] = p0.i; } render(); window.scrollTo(0, 0); return; }
    case "backreview": S.screen = "form"; S.step = 4; render(); window.scrollTo(0, 0); return;
    case "download": baixarRespostas(d); return;
    case "reenviar": enviarRespostas(d); break;
    default: return;
  }
  render();
});

document.addEventListener("input", function (e) {
  var el = e.target; if (!el.matches("[data-path]") || el.tagName === "BUTTON" || el.hasAttribute("data-col")) return;
  setP(S.d, el.getAttribute("data-path"), el.value);
  softRefresh();
});
document.addEventListener("change", function (e) {
  var el = e.target;
  if (el.matches && el.matches('[data-path^="cnpjs."][data-path$=".cnpj"]')) { var fm = cnpjFmt(el.value); el.value = fm; setP(S.d, el.getAttribute("data-path"), fm); el.classList.toggle("bad", !!fm.trim() && !cnpjValido(fm)); softRefresh(); return; }
  if (el.hasAttribute("data-col")) { setP(S.d, el.getAttribute("data-path"), el.value.toUpperCase()); render(); return; }
  if (el.matches("input[data-path]") && el.getAttribute("data-path").match(/^cor/)) { render(); return; }
  var ch = el.getAttribute("data-upl");
  if (ch && el.files && el.files[0]) {
    var f = el.files[0], ok = ch === "logo" ? ["image/png", "image/jpeg", "image/svg+xml"] : ["image/png", "image/jpeg"];
    if (ok.indexOf(f.type) < 0) { S.idvErro = "O arquivo do " + ch + " precisa estar no formato " + (ch === "logo" ? "PNG, JPG ou SVG." : "PNG ou JPG."); render(); return; }
    if (f.size > 2 * 1024 * 1024) { S.idvErro = "O arquivo do " + ch + " passa de 2 MB. Escolha um arquivo menor."; render(); return; }
    var fr = new FileReader();
    fr.onload = function () { S.idvErro = ""; S.d[ch] = { nome: f.name, tipo: f.type, tamanho: f.size, dataUrl: fr.result }; render(); };
    fr.readAsDataURL(f);
  }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && S.modal) { S.modal = null; render(); return; }
  if (e.key === "Enter" && e.target.matches && e.target.matches("input[data-enter]")) { e.preventDefault(); nextQ(); }
});

render();
